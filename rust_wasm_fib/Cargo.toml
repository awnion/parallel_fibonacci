[workspace]
members = ["guest", "guest_fail_child", "guest_fail_supervisor", "host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
async-executor = "1.14.0"
async-recursion = "1.1.1"
futures-lite = "2.6.1"
wasmtime = "44"
wasmtime-wasi = "44"
wasmtime-wasi-threads = "44.0.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
